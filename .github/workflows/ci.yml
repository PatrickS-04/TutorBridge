name: CI

# Every push, every branch - the POE brief requires CI on every push.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Reference: GitHub. n.d. Building and testing Node.js. [Online].
  #   Available at: https://docs.github.com/en/actions/tutorials/build-and-test-code/nodejs [Accessed 21 September 2026].
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend_api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - run: npm test
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/backend_api/serviceAccount.json

  # Reference: GitHub. n.d. Building and testing Java with Gradle. [Online].
  #   Available at: https://docs.github.com/en/actions/tutorials/build-and-test-code/java-with-gradle [Accessed 21 September 2026].
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug
      # Reference: GitHub. n.d. Store and share data with workflow artifacts. [Online].
      #   Available at: https://docs.github.com/en/actions/tutorials/store-and-share-data [Accessed 21 September 2026].
      - uses: actions/upload-artifact@v4
        with:
          name: tutorbridge-debug-apk
          path: android_app/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: android_app/app/build/reports/tests/
