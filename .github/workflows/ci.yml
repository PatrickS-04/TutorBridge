name: CI

# Every push, every branch - the POE brief requires CI on every push.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Reference: GitHub. n.d. Building and testing Node.js. [Online].
  #   Available at: https://docs.github.com/en/actions/tutorials/build-and-test-code/nodejs [Accessed 21 September 2026].
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend_api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - run: npm test
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/backend_api/serviceAccount.json
      # Pushes to master deploy to Azure App Service: dist/ plus runtime deps only.
      # Only this repo holds the publish profile, so the classroom mirror skips it.
      # References:
      # Microsoft. 2025. Deploy by using GitHub Actions. [Online].
      #   Available at: https://learn.microsoft.com/en-us/azure/app-service/deploy-github-actions [Accessed 21 September 2026].
      # Microsoft. 2026. azure/webapps-deploy (Version 3). [Computer program].
      #   Available at: https://github.com/Azure/webapps-deploy [Accessed 21 September 2026].
      # Microsoft. 2025. Quickstart: create a Node.js web app. [Online].
      #   Available at: https://learn.microsoft.com/en-us/azure/app-service/quickstart-nodejs [Accessed 21 September 2026].
      - if: github.ref == 'refs/heads/master' && github.repository == 'DRPS-Solutions/TutorBridge'
        run: npm prune --omit=dev
      - if: github.ref == 'refs/heads/master' && github.repository == 'DRPS-Solutions/TutorBridge'
        uses: azure/webapps-deploy@v3
        with:
          app-name: tutorbridge
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend_api

  # Reference: GitHub. n.d. Building and testing Java with Gradle. [Online].
  #   Available at: https://docs.github.com/en/actions/tutorials/build-and-test-code/java-with-gradle [Accessed 21 September 2026].
  android:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x gradlew
      # lintDebug catches a missing translation or a string whose arguments do not match.
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      # Reference: GitHub. n.d. Store and share data with workflow artifacts. [Online].
      #   Available at: https://docs.github.com/en/actions/tutorials/store-and-share-data [Accessed 21 September 2026].
      - uses: actions/upload-artifact@v4
        with:
          name: tutorbridge-debug-apk
          path: android_app/app/build/outputs/apk/debug/*.apk
      # Signed release APK. A repo without the keystore secrets (a fork, say) skips it.
      # Gradle only names the file app-release.apk when it signed it, so the upload
      # below fails rather than publishing an unsigned build.
      # Reference: Android Developers. 2026. Sign your app. [Online].
      #   Available at: https://developer.android.com/studio/publish/app-signing [Accessed 4 November 2026].
      - if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        with:
          name: tutorbridge-release-apk
          path: android_app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: |
            android_app/app/build/reports/tests/
            android_app/app/build/reports/lint-results-debug.html

  # Continuous delivery: a master push that passes both jobs above publishes its
  # signed APK as a GitHub Release, tagged to match the versionName in the app.
  # Only this job can write to the repo. No APK (keystore secrets missing) fails it.
  # References:
  # GitHub. n.d. Automatic token authentication. [Online].
  #   Available at: https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication [Accessed 4 November 2026].
  # GitHub. n.d. gh release create. [Online].
  #   Available at: https://cli.github.com/manual/gh_release_create [Accessed 4 November 2026].
  release:
    needs: [backend, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'DRPS-Solutions/TutorBridge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tutorbridge-release-apk
      - run: gh release create "v1.0.$GITHUB_RUN_NUMBER" app-release.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
